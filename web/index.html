<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8f5"><title>OpenGames · Beta 0.0.8</title><link rel="icon" type="image/svg+xml" href="/assets/opengames.svg"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/redesign.css"></head>
<body><header class="site-header"><a class="brand" href="#/games" data-page="games"><img src="/assets/opengames.svg" alt="" width="40" height="40"><span>OpenGames<small>BETA 0.0.8</small></span></a><nav id="mainNav" aria-label="Навигация"><a href="#/games" data-page="games" data-label="navGames"></a><a href="#/profile/account" data-page="profile/account" id="profileButton" data-label="navProfile"></a><a href="#/about" data-page="about" data-label="about"></a></nav><div class="header-tools"><a id="loginButton" href="#/auth/login" data-page="auth/login" data-label="login" hidden></a><span id="themeIndicator" aria-hidden="true">☀</span><div id="languageSwitch"><button data-lang="ru">RU</button><button data-lang="en">ENG</button></div></div></header>
<main><p id="notice" role="status" aria-live="polite"></p>
<section id="catalog"><div class="welcome"><div id="popularCarousel" class="welcome-visual popular-carousel" aria-live="polite"></div></div><div class="section-heading"><div><span class="eyebrow">OPENGAMES COLLECTION</span><h2 id="catalogTitle"></h2></div><span class="collection-count"><span id="gameCount">00</span> <span data-label="navGames"></span></span></div><div id="filters" class="toolbar filters"></div><div id="games" class="games"></div></section>
<section id="profilePage" hidden><div class="page-heading"><span class="eyebrow">YOUR SPACE</span><h1 data-label="navProfile"></h1><p data-label="profileLead"></p></div><div class="profile-layout"><nav class="profile-nav"><a href="#/profile/account" data-page="profile/account" data-label="account"></a><a href="#/profile/writer" data-page="profile/writer" data-label="writerTab"></a><a href="#/profile/donors" data-page="profile/donors" data-label="myDonors"></a><a href="#/profile/history" data-page="profile/history" data-label="history"></a></nav><div><p id="profileIntro" class="muted"></p><section id="auth" class="panel"></section><p id="aiStatus" class="muted provider-status"></p><section id="productInfo" class="product-info"></section></div></div></section>
<section id="aboutPage" hidden><div class="about-hero"><div class="about-hero-copy"><span class="eyebrow">OPEN GAMES</span><h1 data-label="aboutTitle"></h1><p data-label="aboutLead"></p><a class="primary-link" href="#/games" data-page="games" data-label="choose"></a></div><div class="about-hero-visual" aria-hidden="true"><img src="/assets/survival.png" alt=""><img src="/assets/detective.png" alt=""><img src="/assets/underwater-station.png" alt=""></div></div><div class="about-grid"><article class="panel"><span class="feature-symbol">◎</span><h2 data-label="aboutOne"></h2><p data-label="aboutOneText"></p></article><article class="panel"><span class="feature-symbol purple">✦</span><h2 data-label="aboutTwo"></h2><p data-label="aboutTwoText"></p></article><article class="panel"><span class="feature-symbol peach">↗</span><h2 data-label="aboutThree"></h2><p data-label="aboutThreeText"></p></article></div><p class="about-note" data-label="aboutNote"></p><details class="parent-note"><summary data-label="aboutParent"></summary><p data-label="aboutParentText"></p><div id="scenarioDescriptions" class="scenario-descriptions"></div></details></section>
<section id="play" class="game" hidden><div class="panel story"><button id="back" class="text-button"></button><div class="game-heading"><span class="eyebrow" data-label="explore"></span><h1 id="title"></h1></div><details id="gameInfo"><summary id="infoTitle"></summary><p id="description"></p><small id="version"></small></details><p id="goal" class="goal"></p><div id="musicControls" class="music-controls" hidden><button id="musicToggle" type="button" aria-pressed="false"></button><label><span data-label="musicVolume"></span><input id="musicVolume" type="range" min="0" max="100" value="35"></label></div><p id="dailyLimit" class="muted" hidden></p><p id="historyNote" class="muted"></p><div id="log" class="log"></div><div id="thinking" class="thinking" role="status" hidden></div><h3 class="next-move" data-label="nextMove"></h3><div id="actions" class="actions"></div><label class="input-label" for="input" data-label="yourWords"></label><form id="actionForm" class="controls"><input id="input" maxlength="2000" autocomplete="off"><button id="send" type="submit"></button></form></div><aside><div class="panel map-panel"><div id="researchMap"></div></div><div class="panel state-panel"><h3 id="stateTitle"></h3><div id="state" class="state"></div><p id="saveStatus" class="muted" role="status"></p><div id="gameTools" class="toolbar"><button id="restart"></button><button id="share"></button></div></div></aside></section>
<section id="flow" class="panel journey" hidden><div class="section-heading"><div><span class="eyebrow" data-label="savedShort"></span><h2 id="flowTitle"></h2><p class="muted" data-label="storyHint"></p></div><button id="flowToggle" class="flow-toggle"></button></div><div id="flowTrack" class="flow-track" tabindex="0"></div><p id="flowCurrent" class="flow-current"></p></section>
</main><footer><a class="brand" href="#/games" data-page="games"><img src="/assets/opengames.svg" width="26" height="26" alt=""><span>OpenGames</span></a><p data-label="footer"></p><button id="footerStorage" class="text-button" data-label="storage"></button></footer><section id="cookieNotice" role="region" aria-label="Storage consent" hidden><div><b>OpenGames</b><p id="cookieText"></p></div><div class="toolbar"><button id="accept"></button><button id="deny"></button></div></section><script type="module" src="/app.js"></script></body></html>
